<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<title>FlowState — logoforslag</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--foreground, #111); background: transparent; }
  h1 { font-size: 15px; font-weight: 650; margin: 0 0 4px; letter-spacing: -0.01em; }
  .lede { font-size: 12px; color: var(--muted-foreground, #666); margin: 0 0 14px; }
  .opt { background: var(--card, #f6f6f6); border-radius: var(--radius, 10px); padding: 14px; margin-bottom: 10px; }
  .head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .num { font: 600 11px/1 ui-monospace, monospace; color: var(--muted-foreground, #777); }
  .name { font-size: 14px; font-weight: 650; }
  .why { font-size: 11.5px; color: var(--muted-foreground, #666); margin-left: auto; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch; }
  .tile { flex: 0 0 auto; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
  .tile.light { background: #f4f1e8; color: #0e1a17; }
  .tile.dark { background: #121b18; color: #e9efea; }
  .tile.big { width: 108px; height: 108px; }
  .tile.small { width: 56px; height: 56px; }
  .ctx { flex: 1 1 220px; min-width: 200px; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .ctx.light { background: #f4f1e8; color: #0e1a17; }
  .ctx.dark { background: #121b18; color: #e9efea; }
  .navrow { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .navrow.muted { opacity: .5; font-weight: 500; font-size: 13px; }
  .atoms { font: 500 9.5px/1.5 ui-monospace, monospace; color: var(--muted-foreground, #777); margin-top: 10px; }
  svg { display: block; }
</style>
</head>
<body>
  <h1>Seks merker, samme idé</h1>
  <p class="lede">Kjørt som skisse gjennom alien-metoden: atomer hentet fra app-merkekorpuset, coherent og availability vurdert, ikke målt med embeddings. Hvert merke er én idé, monokromt, og skal tåle 22 px i sidestolpen. Si nummeret, så bytter jeg ut hånden.</p>
  <div id="root"></div>
<script>
const MARKS = {
  1: `<path d="M20 12a8 8 0 1 1-2.34-5.66" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>`,
  2: `<circle cx="7.4" cy="15.8" r="3.9" fill="currentColor"/><circle cx="13.4" cy="10.6" r="2.5" fill="currentColor"/><circle cx="18.4" cy="7.2" r="1.5" fill="currentColor"/>`,
  3: `<path d="M12 3.2c2.9 3.9 4.2 6.2 4.2 8.8s-1.3 4.9-4.2 8.8c-2.9-3.9-4.2-6.2-4.2-8.8S9.1 7.1 12 3.2z" fill="currentColor"/>`,
  4: `<rect x="5" y="6" width="4.4" height="12" rx="2.2" fill="currentColor"/><rect x="14.6" y="11" width="4.4" height="7" rx="2.2" fill="currentColor"/>`,
  5: `<path fill-rule="evenodd" d="M8 3.5h8A4.5 4.5 0 0 1 20.5 8v8a4.5 4.5 0 0 1-4.5 4.5H8A4.5 4.5 0 0 1 3.5 16V8A4.5 4.5 0 0 1 8 3.5Zm4 4.4a4.1 4.1 0 1 0 0 8.2 4.1 4.1 0 0 0 0-8.2z" fill="currentColor"/>`,
  6: `<path d="M9 20V6a2 2 0 0 1 2-2h7.5M9 12.2h6.6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`
};
const OPTIONS = [
  { n: 1, name: "Ringen", why: "en åpen sirkel, ett gap", atoms: "A8 én strek uten ender · A1 primitiv med ett kutt" },
  { n: 2, name: "Sporet", why: "tre punkter som avtar oppover", atoms: "A5 avtakende skala · A8 retning uten form" },
  { n: 3, name: "Linsen", why: "en linse, som en lyd som åpner seg", atoms: "A2 konvolutt, ikke stolper · A8 én strek uten ender" },
  { n: 4, name: "Terskelen", why: "to stolper, ulik høyde, samme gulv", atoms: "A7 før og etter · A5 rytme i stedet for form" },
  { n: 5, name: "Åpningen", why: "en firkant med et rundt hull", atoms: "A4 negativt rom · A1 primitiv med ett kutt" },
  { n: 6, name: "F-en", why: "en F i én strek, uten ender", atoms: "A6 leses som bokstav · A8 én strek uten ender" }
];
const svg = (n, size) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true">${MARKS[n]}</svg>`;
document.getElementById("root").innerHTML = OPTIONS.map((o) => `
  <section class="opt">
    <div class="head"><span class="num">0${o.n}</span><span class="name">${o.name}</span><span class="why">${o.why}</span></div>
    <div class="row">
      <div class="tile big light">${svg(o.n, 64)}</div>
      <div class="tile big dark">${svg(o.n, 64)}</div>
      <div class="tile small light">${svg(o.n, 22)}</div>
      <div class="tile small dark">${svg(o.n, 22)}</div>
      <div class="ctx light">
        <div class="navrow">${svg(o.n, 22)} FlowState</div>
        <div class="navrow muted">${svg(o.n, 18)} Diktering</div>
      </div>
      <div class="ctx dark">
        <div class="navrow">${svg(o.n, 22)} FlowState</div>
        <div class="navrow muted">${svg(o.n, 18)} Diktering</div>
      </div>
    </div>
    <div class="atoms">${o.atoms}</div>
  </section>`).join("");
</script>
</body>
</html>
