<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<title>FlowState — terskelen, seks varianter</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--foreground, #111); background: transparent; }
  h1 { font-size: 15px; font-weight: 650; margin: 0 0 4px; letter-spacing: -0.01em; }
  .lede { font-size: 12px; color: var(--muted-foreground, #666); margin: 0 0 14px; }
  .opt { background: var(--card, #f6f6f6); border-radius: var(--radius, 10px); padding: 14px; margin-bottom: 10px; }
  .head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .num { font: 600 11px/1 ui-monospace, monospace; color: var(--muted-foreground, #777); }
  .name { font-size: 14px; font-weight: 650; }
  .why { font-size: 11.5px; color: var(--muted-foreground, #666); margin-left: auto; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .tile { flex: 0 0 auto; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
  .tile.light { background: #f4f1e8; color: #0e1a17; }
  .tile.dark { background: #121b18; color: #e9efea; }
  .tile.big { width: 96px; height: 96px; }
  .tile.mid { width: 56px; height: 56px; }
  .tile.tiny { width: 40px; height: 40px; }
  .icon { width: 96px; height: 96px; border-radius: 22px; background: #0f6b5a; color: #fffdf8; display: flex; align-items: center; justify-content: center; }
  .lock { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .lock.light { background: #f4f1e8; color: #0e1a17; }
  .lock.dark { background: #121b18; color: #e9efea; }
  .spec { font: 500 9.5px/1.5 ui-monospace, monospace; color: var(--muted-foreground, #777); margin-top: 10px; }
  svg { display: block; }
</style>
</head>
<body>
  <h1>Terskelen, seks varianter</h1>
  <p class="lede">Samme idé: to stolper, ulik høyde, samme gulv. Det som endres er bredde, gap og hjørneradius. Rekken viser 64 px lys og mørk, 26 px, 16 px, app-ikonet, og låsing med ordmerket.</p>
  <div id="root"></div>
<script>
// 24x24 grid, baseline at y = 19.2
const V = {
  1: { name: "Lik", why: "slik du så den", spec: "w 4.4 · h 12/7 · gap 5.2 · r 2.2", bars: [[5, 6.8, 4.4, 12.4, 2.2], [14.6, 11.8, 4.4, 7.4, 2.2]] },
  2: { name: "Tett", why: "mindre pause, mer terskel", spec: "w 4.6 · h 12/7.6 · gap 3.6 · r 2.3", bars: [[5.4, 6.8, 4.6, 12.4, 2.3], [13.6, 11.2, 4.6, 8, 2.3]] },
  3: { name: "Bred", why: "mer tyngde i 22 px", spec: "w 5.6 · h 12.4/7.2 · gap 3.8 · r 2.8", bars: [[4.6, 6.8, 5.6, 12.4, 2.8], [14, 11.6, 5.6, 7.6, 2.8]] },
  4: { name: "Hel", why: "piller, som resten av appen", spec: "w 5.0 · h 12.6/6.6 · gap 4.0 · r 2.5", bars: [[5.2, 6.6, 5.0, 12.6, 2.5], [14.2, 12.6, 5.0, 6.6, 2.5]] },
  5: { name: "Heng", why: "andre stolpe henger fra toppen", spec: "w 5.0 · h 12.6/6.6 · gap 4.0 · r 2.5 · toppstilt", bars: [[5.2, 6.6, 5.0, 12.6, 2.5], [14.2, 6.6, 5.0, 6.6, 2.5]] },
  6: { name: "Trapp", why: "tre trinn, samme idé", spec: "w 4.2 · h 12.6/9/5.4 · gap 3.4 · r 2.1", bars: [[4.4, 6.6, 4.2, 12.6, 2.1], [11, 9.6, 4.2, 9.6, 2.1], [17.6, 13.8, 4.2, 5.4, 2.1]] }
};
const mark = (id, size) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true">${V[id].bars.map(([x, y, w, h, r]) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="currentColor"/>`).join("")}</svg>`;
document.getElementById("root").innerHTML = Object.entries(V).map(([id, v]) => `
  <section class="opt">
    <div class="head"><span class="num">0${id}</span><span class="name">${v.name}</span><span class="why">${v.why}</span></div>
    <div class="row">
      <div class="tile big light">${mark(id, 64)}</div>
      <div class="tile big dark">${mark(id, 64)}</div>
      <div class="tile mid light">${mark(id, 26)}</div>
      <div class="tile mid dark">${mark(id, 26)}</div>
      <div class="tile tiny light">${mark(id, 16)}</div>
      <div class="icon">${mark(id, 52)}</div>
      <div class="lock light">${mark(id, 22)} FlowState</div>
      <div class="lock dark">${mark(id, 22)} FlowState</div>
    </div>
    <div class="spec">${v.spec}</div>
  </section>`).join("");
</script>
</body>
</html>
