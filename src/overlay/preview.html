<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Recording Overlay Preview</title>
    <!-- Dev-only harness: not a build input (vite.config.ts), never shipped.
         Open at /src/overlay/preview.html; see preview.tsx for the driver. -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #d9d9d9;
      }
      /* The overlay window's own bounds (440x320 at the bottom edge,
         490x440 at the side edges), drawn so the pill's offsets can be read
         off a screenshot. ?edge=left|right moves the frame. */
      #root {
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 440px;
        height: 320px;
        transform: translateX(-50%);
        outline: 1px dashed #999;
        overflow: hidden;
        /* `position: fixed` children (the stage) resolve against this box. */
        contain: layout paint;
      }
      body[data-edge="top"] #root {
        top: 0;
        bottom: auto;
      }
      body[data-edge="left"] #root,
      body[data-edge="right"] #root {
        width: 490px;
        height: 440px;
        top: 50%;
        bottom: auto;
        transform: translateY(-50%);
      }
      body[data-edge="left"] #root {
        left: 0;
      }
      body[data-edge="right"] #root {
        left: auto;
        right: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/overlay/preview.tsx"></script>
  </body>
</html>
